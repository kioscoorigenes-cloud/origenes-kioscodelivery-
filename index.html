<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e40af" />
    <style>
      /* iPhone (PWA instalada): respetar la zona segura del notch / barra de estado,
         para que la hora y la batería del sistema no tapen el header de la app. */
      #root {
        padding-top: env(safe-area-inset-top, 0px);
        background-color: #ffffff;
      }
      /* Barra de navegación inferior: dejar lugar para el "home indicator" del iPhone. */
      nav.bnav {
        height: calc(4rem + env(safe-area-inset-bottom, 0px)) !important;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
    <title>Orígenes Kiosco | Pedidos Va</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
